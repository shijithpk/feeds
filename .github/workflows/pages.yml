name: Publish RSS feeds to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # * is a special character in YAML so you have to quote this string
    # Run every day at 5:30 and 17:30:
    # - cron:  '30 5,17 * * *'
    # Run every hour at 15 and 45 minute mark
    - cron:  '15,45 * * * *'
  workflow_dispatch:

env:
  CI: true
jobs:
  publish-feeds:
    #runs-on: ubuntu-24.04
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    
    - uses: actions/checkout@v2.3.4
    
    - run: npx playwright install --with-deps firefox
    
    # GitHub Actions unfortunately does not support retries;
    # this is a cumbersome method of retrying twice in case of errors:
    - run: npx feed-me-up-scotty || npx feed-me-up-scotty || npx feed-me-up-scotty

    # Record of the Day blocks scotty's second request for the page, so fetch it once here.
    # If this fails, the previously published rotd_uk.xml is kept and the job fails at the end.
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Build Record of the Day feed
      id: rotd
      continue-on-error: true
      run: |
        pip install --quiet beautifulsoup4
        python3 scripts/rotd_feed.py
    
    - name: Deploy to GitHub Pages
      run: |
        git config user.name $GITHUB_ACTOR
        git config user.email $GITHUB_ACTOR@users.noreply.github.com
        git remote add gh-pages-remote https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git
        git fetch --no-recurse-submodules
        git worktree add ./gh-pages gh-pages
        cd gh-pages
        [ -f ../public/rotd_uk.xml ] || cp rotd_uk.xml ../public/rotd_uk.xml
        git rm -r .
        cp -r ../public/. .
        git add .
        git commit --message="Deploying to GitHub Pages from $GITHUB_SHA"
        git push gh-pages-remote gh-pages:gh-pages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}

    - name: Fail if the Record of the Day feed could not be built
      if: steps.rotd.outcome == 'failure'
      run: |
        echo "::error::Record of the Day feed could not be built; the previous rotd_uk.xml was kept."
        exit 1
